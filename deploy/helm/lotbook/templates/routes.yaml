{{- /* Only the ingest contract is exposed; the probes stay inside the cluster. */ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lotbook.fullname" . }}-ingest
  labels:
    {{- include "lotbook.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.ingress.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /v1/
            pathType: Prefix
            backend:
              service:
                name: {{ include "lotbook.fullname" . }}-ingest
                port:
                  name: http
{{- end }}
{{- if .Values.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lotbook.fullname" . }}-ingest
  labels:
    {{- include "lotbook.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
      backendRefs:
        - name: {{ include "lotbook.fullname" . }}-ingest
          port: {{ .Values.service.port }}
{{- end }}
